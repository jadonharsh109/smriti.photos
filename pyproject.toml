[project]
name = "smriti-photos"
version = "1.4.2"
description = "स्मृति Smriti — fully-offline, Google-Photos-style library for your local photos"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Viewers",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pillow>=11.0",
    "pillow-heif>=0.18",
    "numpy>=1.26",
    "scipy>=1.11",
    "imagehash>=4.3.1",
    "sse-starlette>=2.1",
    "onnxruntime>=1.18",
    "scikit-learn>=1.4",
    "reverse-geocoder>=1.5.1",
    "send2trash>=2.1.0",
]

[project.urls]
Homepage = "https://smriti.jadonharsh.in"
Source = "https://github.com/jadonharsh109/smriti.photos"
Issues = "https://github.com/jadonharsh109/smriti.photos/issues"

[project.scripts]
smriti = "smriti_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# the backend package installs as `smriti_server` (imports inside are relative)
[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.hatch.build.targets.wheel.sources]
"backend/app" = "smriti_server"

# ship the built frontend inside the wheel — installed runs need no Node
[tool.hatch.build.targets.wheel.force-include]
"frontend/dist" = "smriti_server/webui"

[tool.hatch.build.targets.sdist]
include = ["backend", "frontend/dist", "scripts", "README.md", "pyproject.toml"]
exclude = ["**/__pycache__"]
# frontend/dist is gitignored; artifacts overrides VCS-ignore so it ships in the sdist
artifacts = ["frontend/dist"]

[tool.uv]
package = false
