[package]
name = "smriti-desktop"
version = "0.1.15"
description = "Smriti — a fully-offline library for your local photos"
authors = ["Harshvardhan Singh Jadon"]
edition = "2021"
rust-version = "1.85" # dependency tree pulls crates requiring edition2024

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde_json = "1"
# process groups on Unix, Job Objects on Windows — one API, and it handles the
# CREATE_SUSPENDED/assign/resume dance so no grandchild can escape the job
command-group = "5"
ureq = "2"
tokio = { version = "1", features = ["time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tauri-utils = "2"
url = "2"
