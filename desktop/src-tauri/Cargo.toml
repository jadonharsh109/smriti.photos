[package]
name = "smriti-desktop"
version = "2.6.0"
description = "Smriti — a fully-offline library for your local photos"
authors = ["Harshvardhan Singh Jadon"]
edition = "2021"
rust-version = "1.85" # dependency tree pulls crates requiring edition2024

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No `devtools` feature: Tauri compiles the inspector into debug builds
# regardless, so `tauri dev` keeps its tools — but a shipped app offering
# "Inspect Element" reads as unfinished, and the feature flag is what was
# putting it there.
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# process groups on Unix, Job Objects on Windows — one API, and it handles the
# CREATE_SUSPENDED/assign/resume dance so no grandchild can escape the job
command-group = "5"
ureq = "2"
tokio = { version = "1", features = ["time"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Unwind, not abort: wry catches the Objective-C exception WebKit raises when a
# scheme task was stopped mid-answer, and objc2 documents that this catch
# cannot work under panic=abort — the exception aborts the process instead.
# That was the crash while playing a video (2.5.0). The main-thread handoff in
# assets.rs avoids raising it; this makes sure it could never be fatal.
panic = "unwind"
strip = true

[dev-dependencies]
tauri-utils = "2"
url = "2"
