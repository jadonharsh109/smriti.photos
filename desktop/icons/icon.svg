<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Smriti app icon: the Logo.tsx brand mark scaled 32x, with the ~10%
       transparent margin the macOS Big Sur icon grid expects (squircle drawn
       at 824x824, centred). `tauri icon` derives every .icns/.ico size here. -->
  <defs>
    <linearGradient id="sm-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB25E"/>
      <stop offset="0.5" stop-color="#FF7B9C"/>
      <stop offset="1" stop-color="#B96BFF"/>
    </linearGradient>
    <linearGradient id="sm-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sm-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#2a1030" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- squircle: 824x824 centred in 1024 -->
  <g filter="url(#sm-shadow)">
    <rect x="100" y="100" width="824" height="824" rx="196" fill="url(#sm-mark)"/>
    <rect x="100" y="100" width="824" height="824" rx="196" fill="url(#sm-shine)" opacity="0.55"/>
    <rect x="100" y="100" width="824" height="824" rx="196" fill="none"
          stroke="#ffffff" stroke-opacity="0.35" stroke-width="4"/>
  </g>

  <!-- lotus, mapped from the 32x32 original into the squircle -->
  <g transform="translate(512 512) scale(25.75) translate(-16 -16)">
    <path d="M16 6.6c2.6 3.3 2.6 7.4 0 10.2-2.6-2.8-2.6-6.9 0-10.2z" fill="#fff" opacity="0.97"/>
    <path d="M9.2 10.6c3.5 0.5 6.1 2.9 6.7 6.3-3.5-0.3-6.2-2.8-6.7-6.3z" fill="#fff" opacity="0.82"/>
    <path d="M22.8 10.6c-3.5 0.5-6.1 2.9-6.7 6.3 3.5-0.3 6.2-2.8 6.7-6.3z" fill="#fff" opacity="0.82"/>
    <path d="M9 19.2c2 2 4.4 3 7 3s5-1 7-3" fill="none" stroke="#fff" stroke-width="1.9"
          stroke-linecap="round" opacity="0.95"/>
    <circle cx="16" cy="24.9" r="1.15" fill="#fff" opacity="0.9"/>
  </g>
</svg>
